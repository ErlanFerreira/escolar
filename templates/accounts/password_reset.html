{% extends "base.html" %}
{% block title %}Redefinir senha{% endblock %}
{% block navbar %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card mt-5">
            <div class="card-body">
                <h1 class="h4 mb-3">Redefinir senha</h1>
                <p>Informe seu e-mail e enviaremos instruções para redefinir sua senha.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.email }}
                    <button type="submit" class="btn btn-primary w-100 mt-3">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
